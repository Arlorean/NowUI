name: Web Bundle

# Keeps the precompiled browser bundle in the package current, automatically.
#
# WHY THIS EXISTS. Assets/NowUI/WebBundle~ is a committed build artifact: a Unity user installs the package,
# clicks Tools > NowUI > Web Preview, and gets NowUI running with no toolchain, offline, because the bundle is
# already on disk. That convenience has one failure mode, and it has already happened once: the bundle silently
# fell a milestone behind its sources, so the preview served the WebAssembly runtime and none of the JavaScript
# drawing surface. Nothing caught it, because the bundle and its own stamp were consistently old together.
#
# So this job rebuilds the bundle from source whenever something that can change it lands on main, and commits
# the result ONLY IF THE PAYLOAD ACTUALLY DIFFERS. That last condition is what keeps a committed binary artifact
# from bloating history: bundle.json stamps the build time, the commit and a dirty flag, so a naive job would
# produce a diff on every single run and commit forever.
#
# WHAT IT DOES NOT DO. It does not run Unity. That is only possible because the bundle's inputs are all
# reproducible outside the editor; if a future change makes the bundle depend on something Unity has to bake,
# this job cannot build it any more and the honest fix is to publish the bundle from the release job instead of
# pretending it is still automatic.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Assets/NowUI/Runtime/**'
      - 'Assets/NowUI/Extensions/**'
      - 'Assets/NowUI/Plugins/WebGL/**'
      - 'Standalone/**'
      - 'Tools/Build-NowUIWebBundle.ps1'
      - 'Tools/Standalone/web-bundle-exclude.txt'
      - '.github/workflows/web-bundle.yml'

permissions:
  contents: write

# One at a time. Two concurrent runs would each rebuild the bundle and race to commit it, and the loser would
# either fail to push or clobber the winner.
concurrency:
  group: web-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache the wasm-tools workload
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-wasm-tools-${{ runner.os }}-9.0.x

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The bundle build leans the four NotoSans faces by dropping their OpenType layout tables, which this host's
      # parser never reads. Without fontTools the script warns and ships them full size rather than failing, so
      # this step is what keeps CI's output the same size as a local one.
      - name: Install fontTools
        run: python3 -m pip install --user fonttools

      - name: Rebuild the bundle
        shell: pwsh
        run: ./Tools/Build-NowUIWebBundle.ps1

      # Everything except bundle.json, whose builtUtc/commit/dirty fields change on every run by design. If only
      # the stamp moved, nothing that reaches a user changed, and committing would be pure history noise.
      - name: Decide whether anything a user would receive actually changed
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- 'Assets/NowUI/WebBundle~' ':(exclude)Assets/NowUI/WebBundle~/bundle.json'; then
            echo "payload=unchanged" >> "$GITHUB_OUTPUT"
            echo "The bundle payload is identical; discarding the rebuilt stamp."
            git checkout -- 'Assets/NowUI/WebBundle~' || true
          else
            echo "payload=changed" >> "$GITHUB_OUTPUT"
            git diff --stat -- 'Assets/NowUI/WebBundle~' | tail -20
          fi

      # [skip ci] matches the convention semantic-release already uses in this repository, and without it this
      # job's own commit would re-trigger every workflow that watches main.
      - name: Commit the refreshed bundle
        if: steps.changed.outputs.payload == 'changed'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'Assets/NowUI/WebBundle~'
          git commit -m "chore(web): refresh the precompiled browser bundle [skip ci]"
          git push
