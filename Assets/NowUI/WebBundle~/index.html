<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NowUI</title>
  <style>
    /* A full-window canvas and nothing else. The page has no DOM to speak of on purpose: everything visible is
       drawn by NowUI through WebGL2, so anything the browser lays out here would be a second, competing answer to
       "what is on screen". */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #nowui-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* The one piece of DOM the page allows itself, and only until the first frame. Without it a boot failure -
       a missing bundle file, a wasm the browser refused, a syntax error in the author's application - is a black
       window and a console line nobody opens. main.js fills it in with the error and removes it on frame one. */
    #nowui-boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin: 0;
      z-index: 20;
      color: #8b949e;
      background: #000;
      font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      overflow: auto;
      text-align: center;
    }

    #nowui-boot.nowui-boot-failed {
      color: #ffa198;
      align-items: flex-start;
      text-align: left;
    }
  </style>
  <script type="module" src="./main.js"></script>
</head>

<body>
  <canvas id="nowui-canvas"></canvas>
  <div id="nowui-boot">Starting NowUI...</div>
</body>

</html>
