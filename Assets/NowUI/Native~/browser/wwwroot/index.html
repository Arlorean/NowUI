<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NowUI</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f1117; }
    #nowui-canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #nowui-status { position: fixed; inset: 0; display: grid; place-content: center; padding: 32px; color: #f3f1fa; background: #0f1117; font: 16px/1.6 system-ui, sans-serif; white-space: pre-wrap; }
    #nowui-status[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="nowui-canvas" tabindex="0" aria-label="NowUI interactive application"></canvas>
  <div id="nowui-status" role="status">Loading…</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
