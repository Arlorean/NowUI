<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NowUI</title>
  <style>
    /* A full-window canvas and nothing else. The page has no DOM to speak of on purpose: everything visible is
       drawn by NowUI through WebGL2, so anything the browser lays out here would be a second, competing answer to
       "what is on screen". */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #nowui-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* The one piece of DOM the page allows itself, and only until the first frame. Without it a boot failure -
       a missing bundle file, a wasm the browser refused, a syntax error in the author's application - is a black
       window and a console line nobody opens. main.js fills it in with the error and removes it on frame one. */
    #nowui-boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin: 0;
      z-index: 20;
      color: #8b949e;
      background: #000;
      font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      overflow: auto;
      text-align: center;
    }

    /* A moving bar under the message, so the wait looks like progress rather than a stalled black page.

       IT IS A PSEUDO-ELEMENT ON PURPOSE. main.js reports a boot failure by REPLACING this element's text, which
       would delete any child node put here; ::after survives that, and the rule below hides it when the message
       turns into an error so a failure never animates as though it were still working.

       Pure CSS and no extra request: this has to paint before anything else has loaded, which is the whole
       point - the WebAssembly runtime needs about a second before NowUI can draw its first frame, and this is
       what the reader looks at until then. */
    #nowui-boot::after {
      content: '';
      position: absolute;
      top: calc(50% + 22px);
      left: 50%;
      margin-left: -90px;
      width: 180px;
      height: 2px;
      border-radius: 1px;
      background: linear-gradient(90deg, #16191d 0%, #4d8ee0 50%, #16191d 100%);
      background-size: 200% 100%;
      animation: nowui-boot-sweep 1.15s linear infinite;
    }

    @keyframes nowui-boot-sweep {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }

    /* A reader who asked for less motion gets a static track rather than nothing: the bar still says "there is
       a thing loading here", it just stops sweeping. */
    @media (prefers-reduced-motion: reduce) {
      #nowui-boot::after { animation: none; background: #2a3038; }
    }

    #nowui-boot.nowui-boot-failed {
      color: #ffa198;
      align-items: flex-start;
      text-align: left;
    }

    #nowui-boot.nowui-boot-failed::after { display: none; }
  </style>
  <script type="module" src="./main.js"></script>
</head>

<body>
  <canvas id="nowui-canvas"></canvas>
  <div id="nowui-boot">Starting NowUI...</div>
</body>

</html>
